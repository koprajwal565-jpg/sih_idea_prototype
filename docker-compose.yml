version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fixnear-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - ENABLE_DEMO_PAYMENT_MODE=true
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fixnear-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
